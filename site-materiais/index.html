<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b10;--card:#151722;--line:rgba(56,217,236,.35);--cyan:#38d9ec;--ink:#f1efe9;--muted:#c9cad2;--dim:#8e909c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'DM Sans',Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:28px 16px}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 18% 8%,rgba(56,217,236,.16),transparent 42%),radial-gradient(circle at 90% 90%,rgba(56,217,236,.08),transparent 40%),radial-gradient(rgba(56,217,236,.18) 1px,transparent 1.4px) 0 0/26px 26px;pointer-events:none;opacity:.9}
.c{position:relative;max-width:500px;width:100%;background:rgba(21,23,34,.94);border:1.5px solid var(--line);border-radius:24px;padding:30px 26px;box-shadow:0 0 70px rgba(56,217,236,.12)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand .t{width:42px;height:42px;border-radius:12px;background:#fff;overflow:hidden;box-shadow:0 0 0 2px rgba(56,217,236,.35)}
.brand .t img{width:42px;height:42px;object-fit:contain}
.brand b{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600}.brand b span{color:var(--cyan)}
.k{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--cyan);margin-bottom:10px}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:36px;line-height:1.05;margin:0 0 12px;color:#f6f4ee}h1 em{color:var(--cyan)}
p{color:var(--muted);font-size:16px;line-height:1.5;margin:0 0 18px}
label{display:block;font-size:14px;font-weight:500;margin:14px 0 6px}
label small{color:var(--dim);font-weight:400}
input{width:100%;background:#0f1119;border:1.5px solid var(--line);border-radius:12px;padding:14px;font:inherit;font-size:16px;color:var(--ink);outline:none}
input:focus{border-color:var(--cyan)}
.ck{display:flex;gap:10px;align-items:flex-start;margin:16px 0 4px;font-size:13px;color:var(--dim);line-height:1.4}
.ck input{width:18px;height:18px;margin-top:1px;flex-shrink:0;accent-color:var(--cyan)}
button,a.b{display:block;width:100%;text-align:center;text-decoration:none;font:inherit;font-weight:700;font-size:16px;border-radius:999px;padding:16px 20px;margin:10px 0 0;cursor:pointer;border:0}
.p{background:var(--cyan);color:#061015;box-shadow:0 14px 44px rgba(56,217,236,.3)}
.s{background:transparent;border:1.5px solid rgba(56,217,236,.5)!important;color:var(--cyan)}
button[disabled]{opacity:.6;cursor:wait}
.err{color:#ff8a8a;font-size:14px;margin-top:10px;min-height:1em}
.f{font-size:12px;color:var(--dim);margin-top:18px;text-align:center}
.hide{display:none}
</style>
</head>

    var ag = document.getElementById('agendar');
    if (isca === 'PROJETO' || isca === 'DIAGNÓSTICO' || isca === 'SITE') ag.classList.add('hide'); else ag.href = site(slug);
    document.getElementById('wpp').href = WPP;
    window.scrollTo(0,0);
  }

  document.getElementById('f').addEventListener('submit', function(ev){
    ev.preventDefault();
    var err = document.getElementById('err'); err.textContent = '';
    var nome = document.getElementById('nome').value.trim();
    var email = document.getElementById('email').value.trim().toLowerCase();
    var tel = document.getElementById('whats').value.replace(/\D/g,'');
    var empresa = document.getElementById('empresa').value.trim();
    if (nome.length < 2) { err.textContent = 'Escreva o seu nome.'; return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err.textContent = 'Confira o e-mail.'; return; }
    if (tel.length < 10 || tel.length > 13) { err.textContent = 'Coloque o WhatsApp com DDD.'; return; }
    if (!document.getElementById('ok').checked) { err.textContent = 'Marque a autorização para receber o material.'; return; }
    if (tel.length <= 11) tel = '55' + tel;
    var btn = document.getElementById('btn'); btn.disabled = true; btn.textContent = 'Enviando...';
    var body = { p_nome: nome, p_telefone: '+' + tel, p_email: email, p_isca: isca,
      p_extra: { empresa: empresa, utm_source: 'instagram', utm_medium: 'dm', utm_campaign: slug, pagina: 'materiais' } };
    fetch(SB, { method:'POST', headers:{ 'Content-Type':'application/json', 'apikey':KEY }, body: JSON.stringify(body) })
      .then(function(r){ if (!r.ok) return r.text().then(function(t){ throw new Error(t); }); mostrar(nome); })
      .catch(function(e){
        var t = String(e && e.message || '');
        if (/email/.test(t)) { err.textContent = 'Confira o e-mail.'; }
        else if (/telefone/.test(t)) { err.textContent = 'Confira o WhatsApp com DDD.'; }
        else { mostrar(nome); } // nunca deixa o lead sem o material
      })
      .finally(function(){ btn.disabled = false; btn.textContent = 'Quero receber'; });
  });
})();
</script>
</body>
</html>
